# Blocky DNS resolver:
# - DoT upstream to Quad9 for encrypted resolution
# - Ad-blocking via StevenBlack's consolidated hosts list, refreshed every 24h
# - Prometheus metrics exposed on :4000/metrics
#
# Anything not set here is a Blocky default: DNS on :53, blocked names
# answered with 0.0.0.0 (zeroIp), log level info, metrics path /metrics.

# bootstrapDns is the resolver Blocky uses before its own upstreams work: it
# resolves dns.quad9.net for the DoT upstream, and Blocky's HTTP client also
# goes through it to download the denylists. Raw Quad9 IPs avoid the
# chicken-and-egg on first start.
bootstrapDns:
  - upstream: 9.9.9.9
  - upstream: 149.112.112.112

upstreams:
  groups:
    default:
      - tcp-tls:dns.quad9.net

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  clientGroupsBlock:
    default: [ads]
  loading:
    refreshPeriod: 24h  # Blocky's default is 4h

caching:
  minTime: 5m
  maxTime: 30m
  prefetching: true

ports:
  http: 4000

prometheus:
  enable: true
