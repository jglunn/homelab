# Monitoring + DNS stack for Raspberry Pi. All services are bound to the
# host's Tailscale IP only, so nothing is reachable on the public interface.

x-common: &common
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  blocky:
    <<: *common
    image: ghcr.io/0xerr0r/blocky:v0.29.0
    container_name: blocky
    ports:
      - "${TS_IP}:53:53/tcp"
      - "${TS_IP}:53:53/udp"
    environment:
      - TZ=${TZ}
    volumes:
      - ./blocky/config.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    cpus: 0.3

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    cpus: 0.1

  cadvisor:
    <<: *common
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 192m
    cpus: 0.5

  prometheus:
    <<: *common
    image: prom/prometheus:v3.11.0
    container_name: prometheus
    # `command` replaces the image's CMD, which is where the config and data
    # paths normally come from, so both have to be restated here.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5

  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    configs:
      - source: ntfy_url
        target: /etc/alertmanager/ntfy_url
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 64m
    cpus: 0.2

  grafana:
    <<: *common
    image: grafana/grafana:12.4.3
    container_name: grafana
    ports:
      - "${TS_IP}:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - TZ=${TZ}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    cpus: 0.5

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

configs:
  # Rendered by Compose from NTFY_TOPIC in .env at `up` time, so the topic never
  # lands in a tracked file. Alertmanager reads it through `url_file`.
  # Inline `content` needs Docker Compose >= 2.23.1.
  ntfy_url:
    content: "https://ntfy.sh/${NTFY_TOPIC}"
